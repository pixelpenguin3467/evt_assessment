apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: evt
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: docker.io/pixelpenguin31/evt-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: evt
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
