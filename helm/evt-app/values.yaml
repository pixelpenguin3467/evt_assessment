namespace: evt

frontend:
  image: evt-frontend
  tag: local
  pullPolicy: Never
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

backend:
  image: evt-backend
  tag: local
  pullPolicy: Never
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

service:
  nodePort: 30080
