<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EVT</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <p class="eyebrow">EVT assessment</p>
      <h1>Frontend site</h1>
      <p>
        Custom nginx image serving this page. Backend status is an HTTP GET from
        this container to <code>http://backend/</code> (in-cluster DNS).
      </p>
    </header>
    <main>
      <section aria-labelledby="backend-heading">
        <h2 id="backend-heading">Backend</h2>
        <p id="backend" role="status">Checking backend…</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
