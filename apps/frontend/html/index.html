<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EVT</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img
          src="pixel_penguin.png"
          width="64"
          height="64"
          alt="Pixel penguin"
        />
        <div>
          <p class="eyebrow">EVT assessment</p>
          <h1>Frontend site</h1>
        </div>
      </div>
      <p>
        Custom nginx image serving this page. Backend status is an HTTP GET from
        this container to <code>http://backend/</code> (in-cluster DNS), not from
        the browser.
      </p>
    </header>
    <main>
      <section aria-labelledby="backend-heading">
        <h2 id="backend-heading">Backend</h2>
        <p id="backend" role="status"><!--# include virtual="/api/backend" --></p>
      </section>
    </main>
  </body>
</html>
