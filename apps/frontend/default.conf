server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # In-cluster DNS: Service "backend" in the same namespace.
    location /api/backend {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://backend/;
    }
}
